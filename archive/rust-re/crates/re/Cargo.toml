[package]
name = "re"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
re-mojo = { path = "../re-mojo" }
re-rtc = { path = "../re-rtc" }
re-encode = { path = "../re-encode" }
serde_json = "1"
log = "0.4"
libloading = "0.8"
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_Console"] }
