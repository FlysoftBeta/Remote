[package]
name = "remotekit-endpoint"
edition.workspace = true
version.workspace = true

[[bin]]
name = "endpoint"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "process", "time"] }
